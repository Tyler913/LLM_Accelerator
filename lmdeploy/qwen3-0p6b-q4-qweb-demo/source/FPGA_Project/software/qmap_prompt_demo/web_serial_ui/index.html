<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen3 FPGA Prompt Console</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">XCZU2EG · Qwen3-0.6B Q4</p>
        <h1>FPGA Prompt Console</h1>
        <p class="subtitle">浏览器通过 USB-UART 控制板上的 PS tokenizer 和有界 greedy decode。</p>
      </div>
      <div class="connection">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">未连接</span>
        <button id="connectButton" type="button">连接串口</button>
      </div>
    </header>

    <section class="panel request-panel">
      <div class="field grow">
        <div class="input-heading">
          <label id="promptLabel" for="promptInput">UTF-8 Prompt</label>
          <select id="inputMode" aria-label="输入模式">
            <option value="text">文本</option>
            <option value="tokens">Token IDs</option>
          </select>
        </div>
        <textarea id="promptInput" rows="4" spellcheck="false"
          placeholder="例如：The future of FPGA is"></textarea>
        <small id="promptHint">首版串口协议接受单行 UTF-8；tokenize 和 detokenize 都在 PS 端完成。</small>
      </div>
      <div class="field compact">
        <label for="maxNewTokens">生成数量</label>
        <input id="maxNewTokens" type="number" min="1" max="256" value="4">
        <button id="generateButton" class="primary" type="button" disabled>开始生成</button>
        <button id="clearButton" type="button">清空日志</button>
      </div>
    </section>

    <section class="panel result-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">STREAM</p>
          <h2>生成 token</h2>
        </div>
        <span id="runState" class="badge">IDLE</span>
      </div>
      <div id="tokens" class="token-list" aria-live="polite">
        <span class="muted">等待板端输出……</span>
      </div>
      <div class="text-output-wrap">
        <span class="output-label">DECODED TEXT</span>
        <pre id="generatedText" class="text-output" aria-live="polite">等待生成文本……</pre>
      </div>
    </section>

    <section class="panel console-panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">UART · 115200 8N1</p>
          <h2>原始日志</h2>
        </div>
        <button id="helpButton" type="button" disabled>发送 HELP</button>
      </div>
      <pre id="console" aria-live="polite"></pre>
    </section>

    <p id="compatibility" class="compatibility"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
